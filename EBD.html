<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bethany 的小房间</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=ZCOOL+KuaiLe&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #5A3A5E;
      --chip: #fff;
      --pop: #FF8FB0;
      color-scheme: light dark;
      box-sizing: border-box
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --chip: #3a2640;
        --ink: #FFE9F2
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #FFF1DC;
      font-family: 'Fredoka', 'ZCOOL KuaiLe', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab
    }

    #pop {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      background: var(--chip);
      color: var(--ink);
      border-radius: 22px;
      padding: 8px 18px;
      text-align: center;
      transform: translate(-50%, -100%) scale(.6);
      opacity: 0;
      transition: .25s cubic-bezier(.3, 1.6, .5, 1);
      box-shadow: 0 8px 24px #ff8a3d33
    }

    #pop.on {
      opacity: 1;
      transform: translate(-50%, -100%) scale(1)
    }

    #pop b {
      display: block;
      font: 400 32px 'ZCOOL KuaiLe', sans-serif;
      line-height: 1.15
    }

    #pop u {
      display: block;
      text-decoration: none;
      color: #FF6F9C;
      font-weight: 700;
      font-size: 16px
    }

    #pop span {
      font-size: 15px
    }

    .f {
      position: fixed;
      z-index: 20;
      background: var(--chip);
      color: var(--ink);
      box-shadow: 0 5px 16px #ff8a3d2e
    }

    #chip {
      left: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      border-radius: 999px;
      padding: 7px 18px;
      font: 400 18px 'ZCOOL KuaiLe', sans-serif
    }

    #mute {
      left: 12px;
      top: calc(58px + env(safe-area-inset-top, 0px));
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      font: 400 16px 'ZCOOL KuaiLe', sans-serif;
      cursor: pointer
    }

    #hint, #bdayBanner { display: none !important }

    .tapPtr {
      position: fixed;
      z-index: 37;
      left: 0;
      top: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
      font-family: 'ZCOOL KuaiLe', sans-serif;
      filter: drop-shadow(0 4px 6px rgba(90, 58, 94, .35));
    }

    .tapPtr .lbl {
      background: #FF5C8D;
      color: #fff;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 17px;
      white-space: nowrap;
      border: 2.5px solid #fff;
    }

    .tapPtr .arr {
      font-size: 54px;
      line-height: 1;
      animation: ptrBounce .7s ease-in-out infinite;
    }

    @keyframes ptrBounce {
      0%, 100% { transform: translateY(-8px) }
      50% { transform: translateY(14px) }
    }

    #hint {
      left: 50%;
      top: calc(8px + env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      font-size: 12px;
      border-radius: 999px;
      padding: 3px 11px;
      opacity: .92;
      white-space: nowrap
    }

    #bar {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px))
    }

    #bar button {
      font: 400 17px 'ZCOOL KuaiLe', sans-serif;
      background: var(--chip);
      color: var(--ink);
      border: 0;
      border-radius: 18px;
      padding: 8px 15px;
      box-shadow: 0 5px 0 #ffd08a, 0 8px 16px #ff8a3d22;
      cursor: pointer;
      transition: transform .12s
    }

    #bar button small {
      display: block;
      font: 500 11px Fredoka, system-ui, sans-serif;
      line-height: 1.2;
      margin-top: 3px;
      color: #BB6D91;
      letter-spacing: .15px
    }

    #bar button:active {
      transform: translateY(3px)
    }

    #phoneBubble {
      position: fixed;
      z-index: 32;
      display: none;
      pointer-events: none;
      background: #fffefa;
      color: #805083;
      border: 3px solid #ffacd2;
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 8px 25px #9b4c8a44;
      transform: translate(-50%, -120%);
      white-space: nowrap
    }

    #phoneBubble small {
      display: block;
      font-size: 14px;
      color: #d16b99;
      text-align: center
    }

    button:focus-visible {
      outline: 4px solid var(--pop);
      outline-offset: 2px
    }

    #dp {
      position: fixed;
      z-index: 20;
      left: calc(14px + env(safe-area-inset-left, 0px));
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 4px
    }

    #dp button {
      border: 0;
      border-radius: 50%;
      background: var(--chip);
      color: var(--ink);
      font-size: 20px;
      box-shadow: 0 4px 0 #ffd08a, 0 6px 14px #ff8a3d22;
      touch-action: none
    }

    #dp button:active {
      transform: translateY(3px)
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: calc(30px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      transition: opacity .7s
    }

    #splash.off {
      opacity: 0
    }

    #splash h1 {
      font: 400 clamp(30px, 7vw, 56px) 'ZCOOL KuaiLe', sans-serif;
      margin: 0;
      color: #5A3A5E;
      text-shadow: 0 3px 0 #fff
    }

    #splash p {
      margin: 4px 0 0;
      font-weight: 700;
      color: #FF6F9C;
      font-size: 19px;
      text-shadow: 0 2px 0 #fff
    }

    #go {
      pointer-events: auto;
      font: 400 24px 'ZCOOL KuaiLe', sans-serif;
      background: #FF9A3C;
      color: #fff;
      border: 0;
      border-radius: 22px;
      padding: 10px 34px;
      box-shadow: 0 6px 0 #e07a1c, 0 10px 20px #e07a1c55;
      cursor: pointer
    }

    @media (prefers-reduced-motion:reduce) {
      #pop {
        transition: none
      }
    }

    #weatherControls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 25;
      background: linear-gradient(135deg, #fff9fbf4, #e9f6fff0);
      border: 2px solid #fff;
      border-radius: 22px;
      padding: 9px 12px;
      display: flex;
      gap: 9px;
      align-items: center;
      box-shadow: 0 5px 18px #a56c9c35;
      max-width: min(75vw, 480px);
      flex-wrap: wrap
    }

    #weatherControls label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #8b5c85;
      font-size: 13px;
      font-weight: 800
    }

    #weatherControls small {
      font-size: 10px;
      color: #b789a8;
      font-weight: 500
    }

    #weatherControls select {
      max-width: 210px;
      border: 1px solid #ffd6e9;
      border-radius: 14px;
      background: #fff9ff;
      color: #815477;
      padding: 7px 9px;
      font: 600 12px Fredoka, system-ui, sans-serif;
      cursor: pointer
    }

    #weatherAtmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: background 1.2s, opacity 1.2s
    }

    #weatherAtmosphere.rain {
      opacity: 1;
      background: repeating-linear-gradient(110deg, transparent 0 47px, #b8d9ff0e 49px 51px, transparent 53px 105px);
      animation: weatherDrift .65s linear infinite
    }

    #weatherAtmosphere.snow {
      opacity: .65;
      background-image: radial-gradient(circle, #fff 1.8px, transparent 2.7px), radial-gradient(circle, #fff 1.2px, transparent 2px);
      background-size: 95px 100px, 145px 130px;
      animation: snowDrift 8s linear infinite
    }

    #weatherAtmosphere.wind {
      opacity: .14;
      background: radial-gradient(ellipse at 70% 20%, #e6f9ff, transparent 65%);
      animation: windBreath 5s ease-in-out infinite alternate
    }

    #weatherAtmosphere.cloud {
      opacity: .35;
      background: linear-gradient(115deg, #b8c2d344, transparent 65%)
    }

    #weatherAtmosphere.sun {
      opacity: .35;
      background: radial-gradient(ellipse at 25% 18%, #fff2a455, transparent 50%)
    }

    #weatherAtmosphere.night {
      filter: brightness(.65)
    }

    @keyframes windBreath {
      to {
        opacity: .28;
        transform: translateX(12px)
      }
    }

    @keyframes weatherDrift {
      to {
        background-position: 0 160px
      }
    }

    @keyframes snowDrift {
      to {
        background-position: 30px 140px, -20px 180px
      }
    }

    @media(max-width:680px) {
      #weatherControls {
        top: 102px;
        right: 8px;
        padding: 6px;
        gap: 4px
      }

      #weatherControls select {
        max-width: 140px;
        font-size: 11px
      }

      #mute {
        top: 55px
      }
    }

    #wardrobePanel {
      position: fixed;
      z-index: 36;
      right: 16px;
      top: 165px;
      max-width: 260px;
      background: #fffaf8f5;
      border: 3px solid #ffd0df;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 12px 35px #64436555;
      color: #67415e;
      display: none;
      text-align: center
    }

    #wardrobePanel h3 {
      margin: 0 0 5px;
      font-size: 21px
    }

    #wardrobePanel p {
      margin: 0 0 10px;
      font-size: 12px;
      color: #a86e9a
    }

    #wardrobePanel .colors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px
    }

    #wardrobePanel .colors button {
      background: #fff;
      border: 2px solid #f6dce9;
      border-radius: 13px;
      padding: 7px 3px;
      color: #704b6c;
      font: 600 14px 'ZCOOL KuaiLe', sans-serif;
      cursor: pointer
    }

    #wardrobePanel .colors small {
      display: block;
      font: 11px system-ui, sans-serif;
      color: #ae7d9c
    }

    #wardrobeClose {
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      padding: 6px 18px;
      background: #ffd5e5;
      color: #79465d;
      cursor: pointer
    }

    @media(max-width:680px) {
      #wardrobePanel {
        top: 155px;
        right: 8px;
        max-width: 220px
      }
    }

    #bdayBanner {
      position: fixed;
      z-index: 28;
      left: 50%;
      top: calc(34px + env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      background: linear-gradient(135deg, #fff8e7, #ffe5f0);
      border: 2px solid #ff7aa8;
      border-radius: 999px;
      padding: 4px 14px;
      font: 400 13px 'ZCOOL KuaiLe', sans-serif;
      color: #6b3b64;
      box-shadow: 0 6px 16px rgba(255, 119, 170, 0.28);
      display: none;
      align-items: center;
      gap: 6px;
      animation: bdayPulse 1.6s ease-in-out infinite;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes bdayPulse {

      0%,
      100% {
        transform: translateX(-50%) scale(1)
      }

      50% {
        transform: translateX(-50%) scale(1.03)
      }
    }

    #pianoControl {
      position: fixed;
      z-index: 34;
      left: 50%;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: none;
      gap: 10px;
      align-items: center;
      background: #fffafef2;
      border: 2.5px solid #ffd27d;
      border-radius: 999px;
      padding: 8px 18px;
      box-shadow: 0 10px 28px #5a3a5e33;
      flex-wrap: wrap;
      justify-content: center;
    }

    #pianoControl button {
      border: 0;
      border-radius: 999px;
      padding: 7px 16px;
      font: 400 16px 'ZCOOL KuaiLe', sans-serif;
      cursor: pointer;
    }

    #btnPlayPiano {
      background: #FF8FB0;
      color: #fff;
      box-shadow: 0 3px 0 #d9668a
    }


    #btnEndStory {
      background: linear-gradient(135deg, #8B78FF, #5BC0EB);
      color: #fff;
      box-shadow: 0 3px 0 #6252cc;
      display: none
    }

    #endOverlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(42, 26, 48, 0.68);
      backdrop-filter: blur(8px);
      padding: 20px;
    }

    #endOverlay.show {
      display: flex
    }

    .endCard {
      background: linear-gradient(165deg, #fffaf3, #ffeaf2);
      border: 4px solid #ffd0df;
      border-radius: 30px;
      padding: 30px 26px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      color: #5A3A5E;
      box-shadow: 0 18px 48px rgba(45, 20, 50, 0.42);
    }

    .endCard h2 {
      margin: 0 0 12px;
      font: 400 30px 'ZCOOL KuaiLe', sans-serif;
      color: #FF6F9C
    }

    .hskBlessing {
      margin: 0 0 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #6b476e
    }

    .hskLine {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      padding: 8px 12px
    }

    .hskLine strong {
      display: block;
      font-size: 20px;
      color: #5A3A5E;
      font-weight: 700
    }

    .hskLine em {
      display: block;
      font-style: normal;
      font-size: 13px;
      color: #FF6F9C
    }

    .hskLine span {
      display: block;
      font-size: 14px;
      color: #7a537e
    }

    .endBtns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .endBtns button {
      border: 0;
      border-radius: 18px;
      padding: 10px 22px;
      font: 400 18px 'ZCOOL KuaiLe', sans-serif;
      cursor: pointer;
    }

    #btnReplayAll {
      background: #FF8FB0;
      color: #fff;
      box-shadow: 0 4px 0 #d9668a
    }

    #btnStayRoom {
      background: #FFE29A;
      color: #5A3A5E;
      box-shadow: 0 4px 0 #dfb85e
    }
  </style>
</head>

<body>
  <div id="chip" class="f">📅 11月19日 · Bethany 的<ruby>小房间<rt>xiǎo fáng jiān</rt></ruby></div>
  <button id="mute" class="f">🎵 音乐 开 <small>yīn yuè kāi</small></button>
  <div id="hint" class="f">今天几号？</div>
  <div id="bdayBanner">📅 今天几号？</div>
  <div id="pianoControl">
    <button id="btnPlayPiano">⏸️ 暂停/播放钢琴曲</button>
    <button id="btnEndStory">🎬 End</button>
  </div>
  <div id="pop"><b></b><u></u><span></span></div>
  <div id="phoneBubble"><span></span><small></small></div>
  <div id="dp"><i></i><button data-d="up">▲</button><i></i><button data-d="left">◀</button><i></i><button
      data-d="right">▶</button><i></i><button data-d="down">▼</button><i></i></div>
  <div id="bar">
    <button data-a="smile">😊 笑一笑<small>xiào yi xiào</small></button><button data-a="walk">👣 走两步<small>zǒu liǎng
        bù</small></button><button data-a="chair">🪑 坐椅子<small>zuò yǐ zi</small></button>
    <button data-a="phone">📱 打电话<small>dǎ diàn huà</small></button><button data-a="type">⌨️ 打电脑<small>dǎ diàn
        nǎo</small></button><button data-a="pet">💗 摸宠物<small>mō chǒng wù</small></button><button data-a="bed">🛏️
      坐床上<small>zuò chuáng shàng</small></button><button data-a="sleep">😴 睡觉<small>shuì jiào</small></button><button
      data-a="sofa">🛋️ 坐沙发<small>zuò shā fā</small></button><button data-a="cheer">🎉 庆祝<small>qìng
        zhù</small></button>
  </div>
  <div id="weatherControls" aria-label="天气与昼夜设置">
    <label>🌦️ 天气 <small>tiān qì</small><select id="weatherChoice">
        <option value="random">🎲 随机 · suí jī</option>
        <option value="sun">☀️ 晴天 · qíng tiān</option>
        <option value="cloud">☁️ 多云 · duō yún</option>
        <option value="rain">🌧️ 下雨 · xià yǔ</option>
        <option value="snow">❄️ 下雪 · xià xuě</option>
        <option value="wind">🍃 刮风 · guā fēng</option>
      </select></label>
    <label>🕰️ 时间 <small>shí jiān</small><select id="dayChoice">
        <option value="auto">🔄 自动 · zì dòng</option>
        <option value="day">🌞 白天 · bái tiān</option>
        <option value="sunset">🌇 傍晚 · bàng wǎn</option>
        <option value="night">🌙 晚上 · wǎn shang</option>
      </select></label>
  </div>
  <div id="weatherAtmosphere" aria-hidden="true"></div>
  <div id="wardrobePanel">
    <h3>👗 换衣服</h3>
    <p>huàn yī fu · 选择颜色 xuǎn zé yán sè</p>
    <div class="colors" id="wardrobeColors"></div><button id="wardrobeClose">完成 · wán chéng</button>
  </div>
  <div id="splash">
    <div>
      <h1>Bethany 的<ruby>小房间<rt>xiǎo fáng jiān</rt></ruby></h1>
      <p>11月19日 · 温馨的小日常</p>
    </div><button id="go">进入 Enter</button>
  </div>

  <div id="endOverlay">
    <div class="endCard">
      <h2>🎂 生日快乐！</h2>
      <div class="hskBlessing">
        <div class="hskLine">
          <strong>生日快乐！</strong>
          <em>shēng rì kuài lè!</em>
          <span>Happy birthday!</span>
        </div>
        <div class="hskLine">
          <strong>祝你开心！</strong>
          <em>zhù nǐ kāi xīn!</em>
          <span>Wish you happy!</span>
        </div>
      </div>
      <div class="endBtns">
        <button id="btnReplayAll">🔄 再看一遍</button>
        <button id="btnStayRoom">🏠 留在房间</button>
      </div>
    </div>
  </div>

  <!-- 关联同目录下的钢琴录音文件 -->
  <audio id="pianoAudio" src="ossia%20cadenza.mp3" preload="auto"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        const bethany = Math.atan2(B.position.x - ETH.position.x, B.position.z - ETH.position.z);
        const offset = Math.atan2(Math.sin(bethany - view), Math.cos(bethany - view));
        return view + Math.max(-Math.PI / 4, Math.min(Math.PI / 4, offset));
      }

      function turnEthanTo(a, ms = 550) {
        return new Promise(resolve => {
          const r0 = ETH.rotation.y; let d = Math.atan2(Math.sin(a - r0), Math.cos(a - r0)); const t0 = performance.now();
          (function stp(now) { const u = Math.min(1, (now - t0) / ms), e = u * u * (3 - 2 * u); ETH.rotation.y = r0 + d * e; if (u < 1) requestAnimationFrame(stp); else resolve() })(t0);
        });
      }
      window.startBirthdayStory = async function () {
        if (busy) return;
        if (bdayState === 'done' && !ETH.visible) { bdayState = 'ready' }
        busy = true;
        storyLocksEnvironment = true;
        bdayState = 'playing';
        $('#bdayBanner').style.display = 'none';
        updateCalendar();

        try {
          // 1. Bethany 走到日历前，说 11月19号 + 接着对自己说“给Ethan打个电话”
          await stand();
          await go(-4.65, 4.35);
          st.face = -Math.PI / 2;
          await sleep(500);

          await sayAndWait(B, '啊！今天是11月19号了', 'ā! jīn tiān shì shí yī yuè shí jiǔ hào le', 'Ah! Today is November 19th!');
          await sleep(600);
          await sayAndWait(B, '给Ethan打个电话', 'gěi Ethan dǎ gè diàn huà', 'Let me give Ethan a call.');
          await sleep(450);

          // 2. 走到中间打电话叫 Ethan 过来
          await go(-.2, 2.6);
          st.face = .35;
          await sleep(350);
          await makePhoneCall([
            ['Ethan，请到我这里来。', 'Ethan, qǐng dào wǒ zhè lǐ lái.']
          ]);

          // 3. Ethan 从远处慢慢走过来，停稳后再敲门，门滑开后再进屋
          await sleep(800);
          ETH.visible = true;
          ETH.position.set(8.5, 0, 5.45);
          ETH.rotation.y = -Math.PI / 2;
          await moveEthanTo(6.55, 5.45, 1.25);

          say(B, '敲门了，我去开门！', 'qiāo mén le, wǒ qù kāi mén!', 'Someone is knocking, let me open the door!');
          await sleep(900);

          await go(3.9, 5.0);
          st.face = Math.PI / 2;
          await sleep(450);

          await new Promise(resolve => {
            const t0 = performance.now();
            function slideStep(now) {
              const u = Math.min(1, (now - t0) / 1100), e = u * u * (3 - 2 * u);

          await sleep(400);

          st.face = Math.PI / 2 - .55;

          await sleep(300);

          await sayAndWait(B, '今天是几号？', 'jīn tiān shì jǐ hào?', 'What is the date today?');
          await sleep(400);

          await sayAndWait(ETH, '不知道。', 'bù zhī dào.', 'I don\'t know.', true);
          await sleep(400);

          st.akimbo = true;
          await sayAndWait(B, '这你都不知道？', 'zhè nǐ dōu bù zhī dào?', 'You don\'t even know that?');
          await sleep(500);
          st.akimbo = false;
          await sleep(600);

          // 6. Bethany 去衣服抽屉拿礼物，拉开距离后伸手递过去，Ethan 伸手接住
          await go(-4.25, 5.05);
          st.face = -Math.PI / 2;
          const topDrawer = dresserDrawers[0];
          topDrawer.open = true;
          await new Promise(resolve => {
            const t0 = performance.now();
            function dStep(now) {
              const u = Math.min(1, (now - t0) / 450), e = u * u * (3 - 2 * u);
              topDrawer.drawer.position.z = .44 + e * .58;
              if (u < 1) requestAnimationFrame(dStep); else resolve();
            }
            requestAnimationFrame(dStep);
          });
          await sleep(400);

          giftGroup.visible = true;
          giftLid.position.set(0, .46, 0);
          giftLid.rotation.set(0, 0, 0);
          pianoModel.visible = false;
          ethanHoldingPiano = false;
          ethanDancing = false;
          giftCarriedByBethany = true;

          await new Promise(resolve => {
            const t0 = performance.now();
            function cStep(now) {
              const u = Math.min(1, (now - t0) / 400), e = u * u * (3 - 2 * u);
              topDrawer.drawer.position.z = 1.02 - e * .58;
              if (u < 1) requestAnimationFrame(cStep); else resolve();
            }
            requestAnimationFrame(cStep);
          });
          topDrawer.open = false;

          // Bethany 停在距离 Ethan 约 2.1 米处伸手递礼物，Ethan 伸手接过
          await go(.15, 3.75);
          st.face = Math.PI / 2;
          await turnEthanTo(-Math.PI / 2, 400);
          st.offeringGift = true;
          ethanReceivingGift = true;
          await sleep(750);

          giftCarriedByBethany = false;
          giftGroup.position.set(1.55, .98, 3.75);
          await sleep(550);

          st.offeringGift = false;
          ethanReceivingGift = false;
          await go(-.85, 3.75);
          st.face = Math.PI / 2 - .55;
          await turnEthanTo(ethanConversationAngle(), 500);

          // 7. Ethan 说“我知道今天几号，谢谢。”
          ethanPermanentSmile = true;
          await sayAndWait(ETH, '我知道今天几号，谢谢。', 'wǒ zhī dào jīn tiān jǐ hào, xiè xie.', 'I know what date it is today, thank you.', true);
          await sleep(350);
          await sayAndWait(ETH, '今天11月19号，是我的生日。', 'jīn tiān shí yī yuè shí jiǔ hào, shì wǒ de shēng rì.', 'Today is November 19th, it\'s my birthday.', true);
          await sleep(650);

          // 8. 视角转到 Ethan 拿礼物这边，配心里话“啊，好开心，会是什么？”
          await turnEthanTo(0, 500);
          giftGroup.position.set(ETH.position.x - .42, .92, ETH.position.z + .52);
          setFocusShowcase(true);
          await sleep(750);
          say(ETH, '啊，好开心，会是什么？', 'ā, hǎo kāi xīn, huì shì shén me?', 'So excited, what could it be?', true);

          bdayState = 'done';
          updateCalendar();
        } finally {
          st.happy = false; st.hop = false; st.akimbo = false; st.offeringGift = false; ethanReceivingGift = false;
          busy = false;
        }
      };

      $('#bdayBanner').onclick = () => { if (introDelayReady) window.startBirthdayStory() };

      const tick2 = ms => {
        requestAnimationFrame(tick2); const t = ms / 1000, now = performance.now();
        const hap = ethanPermanentSmile || (now < mood);
        if (ETH.visible) {
          if (ethanWalkGoal) {
            const dx = ethanWalkGoal.x - ETH.position.x, dz = ethanWalkGoal.z - ETH.position.z, d = Math.hypot(dx, dz);
            if (d < .08) {
              ethanWalkGoal = null;
              eLegs.forEach(l => l.rotation.x = 0);
              const res = ethanWalkResolve; ethanWalkResolve = null; res && res();
            } else {
              const spd = ethanWalkGoal.speed || 1.35;
              const step = Math.min(d, dt * spd);
              ETH.position.x += dx / d * step; ETH.position.z += dz / d * step;
              ETH.rotation.y = Math.atan2(dx, dz);
              const w = Math.sin(t * 8) * .45;
              eLegs.forEach((l, i) => l.rotation.x = w * (i ? 1 : -1));
            }
          } else if (ethanDancing && ethanHoldingPiano && pianoMusicPlaying) {
            // 检查整段跑动路线，给地上的盒身和盒盖都留出空间。
            if (!window.__runGoal || Math.hypot(window.__runGoal.x - ETH.position.x, window.__runGoal.z - ETH.position.z) < .2)
              window.__runGoal = chooseEthanRunGoal();
            const goal = window.__runGoal;
            if (goal) {
              const rdx = goal.x - ETH.position.x, rdz = goal.z - ETH.position.z;
              const rd = Math.hypot(rdx, rdz);
              const rstep = Math.min(rd, dt * 2.7);
              ETH.position.x += rdx / rd * rstep; ETH.position.z += rdz / rd * rstep;
              const turn = Math.atan2(rdx, rdz) - ETH.rotation.y;
              ETH.rotation.y += Math.atan2(Math.sin(turn), Math.cos(turn)) * Math.min(1, dt * 7);
            }
            ETH.position.y = Math.abs(Math.sin(t * 12)) * .15;
            ETH.rotation.z = Math.sin(t * 6) * .08;
            eLegs.forEach((l, i) => { l.rotation.x = Math.sin(t * 12 + i * Math.PI) * .75 });
          } else if (ethanDancing) {
            ETH.position.y = Math.abs(Math.sin(t * 7.5)) * .16;
            ETH.rotation.z = Math.sin(t * 3.75) * .11;
            eLegs.forEach((l, i) => {
              l.rotation.x = Math.sin(t * 7.5 + i * Math.PI) * .32;
            });
          } else {
            window.__runGoal = null;
            if (ethanHoldingPiano) { let fa = 0 - ETH.rotation.y; fa = Math.atan2(Math.sin(fa), Math.cos(fa)); ETH.rotation.y += fa * Math.min(1, dt * 4) }
            ETH.position.y += (0 - ETH.position.y) * Math.min(1, dt * 10);
            ETH.rotation.z += (0 - ETH.rotation.z) * Math.min(1, dt * 10);
            eLegs.forEach(l => l.rotation.x *= .85);
          }

          tor.scale.y = 1 + Math.sin(t * 2) * .012;
          if (!focusT && !ethanDancing) {
            let ra = Math.atan2(B.position.x - ETH.position.x, B.position.z - ETH.position.z) - ETH.rotation.y;
            ra = Math.atan2(Math.sin(ra), Math.cos(ra));
            const headLimit = busy && !ethanReceivingGift ? .18 : .49;
            const headTurn = Math.max(-headLimit, Math.min(headLimit, ra * .7));
            eHead.rotation.y += (headTurn - eHead.rotation.y) * .06;
          } else {
            eHead.rotation.y += (Math.sin(t * (ethanDancing ? 3.75 : 1.2)) * (ethanDancing ? .22 : 0) - eHead.rotation.y) * .1;
          }
          eHead.rotation.z = ethanDancing ? Math.sin(t * 7.5) * .12 : Math.sin(t * 1.1) * .03;

          eArms.forEach((a, i) => {
            const s = i ? 1 : -1;
            if (ethanHoldingPiano) {
              a.rotation.z += (s * .28 + (ethanDancing ? Math.sin(t * 7.5 + i) * .14 : 0) - a.rotation.z) * .22;
              a.rotation.x += (-0.82 + (ethanDancing ? Math.sin(t * 13 + i * 1.4) * 0.16 : 0) - a.rotation.x) * .24;
            } else if (ethanReceivingGift) {
              a.rotation.z += (s * .12 - a.rotation.z) * .22;
              a.rotation.x += (-1.05 - a.rotation.x) * .22;
            } else {
              const tgt = (i && now < wave) ? 2.4 + Math.sin(t * 10) * .3 : s * .06 + Math.sin(t * 1.6 + i) * .02;
              a.rotation.z += (tgt - a.rotation.z) * .2;
              a.rotation.x += (0 - a.rotation.x) * .2;
            }
          });

          if (ethanHoldingPiano && pianoModel.visible) {
            const fwdX = Math.sin(ETH.rotation.y), fwdZ = Math.cos(ETH.rotation.y);
            pianoModel.position.set(
              ETH.position.x + fwdX * .46,
              ETH.position.y + 1.16 + Math.sin(t * 7.5) * (ethanDancing ? .035 : 0),
              ETH.position.z + fwdZ * .46
            );
            pianoModel.rotation.y = ETH.rotation.y;
          }

          // Ethan 说话时嘴巴开合动起来
          const eTalkPulse = ethanSpeaking && Math.sin(t * 16) > 0.1;
          const blink = (t % 4.3) < .12;
          eEyes.forEach(e => e.scale.y += ((hap ? .52 : blink ? .1 : 1.25) - e.scale.y) * .4);
          if (eTalkPulse) {
            mF.visible = true;
            mS.visible = false;
            mF.scale.set(1.15, 2.2 + Math.abs(Math.sin(t * 16)) * 1.4, 1);
          } else {
            mF.scale.set(1, 1, 1);
            mF.visible = !hap;
            mS.visible = hap;
          }
        }
        window.focusE += (focusT - window.focusE) * .05;
      };
      requestAnimationFrame(tick2);
    }

    /* ---- music: bouncy 8-bit loop (WebAudio) ---- */
    let ac, bus, nb, on = false, ms = 0, nT = 0, mT;
    const ROOT = [48, 45, 53, 55, 48, 52, 53, 55];
    const MEL = [[76, 0, 79, 0, 84, 0, 79, 0], [81, 0, 79, 0, 76, 0, 72, 0], [77, 0, 81, 0, 84, 0, 81, 0], [79, 0, 83, 0, 86, 0, 83, 79], [84, 0, 79, 0, 76, 79, 84, 0], [83, 0, 79, 0, 76, 0, 79, 83], [81, 0, 77, 0, 81, 84, 81, 0], [79, 0, 83, 79, 77, 0, 72, 0]];
    function nt(m, t, d, v, ty) { if (pianoMusicPlaying) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = ty; o.frequency.value = 440 * 2 ** ((m - 69) / 12); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .006); g.gain.setValueAtTime(v, t + d * .5); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .02) }
    function hat(t) { if (pianoMusicPlaying) return; const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = nb; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + .05); b.connect(g); g.connect(bus); b.start(t); b.stop(t + .06) }
    function msched() { if (!on || pianoMusicPlaying) return; while (nT < ac.currentTime + .5) { const s = ms % 64, b = s >> 3, i = s & 7, r = ROOT[b]; if (MEL[b][i]) nt(MEL[b][i], nT, .34, .06, 'square'); if (i === 0) nt(r - 12, nT, .45, .2, 'triangle'); if (i === 4) nt(r - 5, nT, .4, .17, 'triangle'); if (i & 1) nt(r + [0, 4, 7, 12][i >> 1 & 3], nT, .12, .022, 'square'); if (i === 2 || i === 6) hat(nT); nT += .24; ms++ } }
    function startMusic() { if (pianoMusicPlaying) return; try { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); const m = ac.createGain(); m.gain.value = .5; m.connect(ac.destination); bus = ac.createGain(); bus.connect(m); nb = ac.createBuffer(1, 2400, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++)d[i] = Math.random() * 2 - 1 } ac.resume(); nT = ac.currentTime + .1; clearInterval(mT); mT = setInterval(msched, 120); on = true; $('#mute').textContent = '🎵 音乐 开 · yīn yuè kāi' } catch (e) { } }
    $('#mute').onclick = () => { if (pianoMusicPlaying) return; if (!ac) { startMusic(); return } if (on) { clearInterval(mT); ac.suspend(); on = false; $('#mute').textContent = '🔇 音乐 关 · yīn yuè guān' } else startMusic() };
  </script>
