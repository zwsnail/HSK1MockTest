<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bethany 的小房间 · HSK 1 第一名</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--ink:#5A3A5E;--chip:#fff;--pop:#FF8FB0;color-scheme:light dark;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chip:#3a2640;--ink:#FFE9F2}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#FFF1DC;font-family:'Fredoka','ZCOOL KuaiLe',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:grab}
#pop{position:fixed;z-index:30;pointer-events:none;background:var(--chip);color:var(--ink);border-radius:22px;padding:8px 18px;text-align:center;transform:translate(-50%,-100%) scale(.6);opacity:0;transition:.25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 24px #ff8a3d33}
#pop.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#pop b{display:block;font:400 34px 'ZCOOL KuaiLe',sans-serif;line-height:1.1}
#pop u{display:block;text-decoration:none;color:#FF6F9C;font-weight:700;font-size:16px}
#pop span{font-size:15px}
.f{position:fixed;z-index:20;background:var(--chip);color:var(--ink);box-shadow:0 5px 16px #ff8a3d2e}
#chip{left:12px;top:calc(12px + env(safe-area-inset-top,0px));border-radius:999px;padding:7px 18px;font:400 18px 'ZCOOL KuaiLe',sans-serif}
#mute{left:12px;top:calc(58px + env(safe-area-inset-top,0px));border:0;border-radius:999px;padding:7px 14px;font:400 16px 'ZCOOL KuaiLe',sans-serif;cursor:pointer}
#hint{right:12px;top:calc(56px + env(safe-area-inset-top,0px));font-size:13px;border-radius:999px;padding:3px 12px;opacity:.9}
#bar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
#bar button{font:400 17px 'ZCOOL KuaiLe',sans-serif;background:var(--chip);color:var(--ink);border:0;border-radius:18px;padding:8px 15px;box-shadow:0 5px 0 #ffd08a,0 8px 16px #ff8a3d22;cursor:pointer}
#bar button small{display:block;font:500 11px Fredoka,system-ui,sans-serif;line-height:1.2;margin-top:3px;color:#BB6D91;letter-spacing:.15px}
#bar button:active{transform:translateY(3px)}
#phoneBubble{position:fixed;z-index:32;display:none;pointer-events:none;background:#fffefa;color:#805083;border:3px solid #ffacd2;border-radius:24px;padding:12px 18px;font-size:24px;font-weight:700;box-shadow:0 8px 25px #9b4c8a44;transform:translate(-50%,-120%);white-space:nowrap}
#phoneBubble small{display:block;font-size:14px;color:#d16b99;text-align:center}
button:focus-visible{outline:4px solid var(--pop);outline-offset:2px}
#dp{position:fixed;z-index:20;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
#dp button{border:0;border-radius:50%;background:var(--chip);color:var(--ink);font-size:20px;box-shadow:0 4px 0 #ffd08a,0 6px 14px #ff8a3d22;touch-action:none}
#dp button:active{transform:translateY(3px)}
#splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));pointer-events:none;transition:opacity .7s}
#splash.off{opacity:0}
#splash h1{font:400 clamp(30px,7vw,56px) 'ZCOOL KuaiLe',sans-serif;margin:0;color:#5A3A5E;text-shadow:0 3px 0 #fff}
#splash p{margin:4px 0 0;font-weight:700;color:#FF6F9C;font-size:19px;text-shadow:0 2px 0 #fff}
#go{pointer-events:auto;font:400 24px 'ZCOOL KuaiLe',sans-serif;background:#FF9A3C;color:#fff;border:0;border-radius:22px;padding:10px 34px;box-shadow:0 6px 0 #e07a1c,0 10px 20px #e07a1c55;cursor:pointer}
@media (prefers-reduced-motion:reduce){#pop{transition:none}}
#weatherControls{position:fixed;top:12px;right:12px;z-index:25;background:linear-gradient(135deg,#fff9fbf4,#e9f6fff0);border:2px solid #fff;border-radius:22px;padding:9px 12px;display:flex;gap:9px;align-items:center;box-shadow:0 5px 18px #a56c9c35;max-width:min(75vw,480px);flex-wrap:wrap}
#weatherControls label{display:flex;flex-direction:column;gap:3px;color:#8b5c85;font-size:13px;font-weight:800}
#weatherControls small{font-size:10px;color:#b789a8;font-weight:500}
#weatherControls select{max-width:210px;border:1px solid #ffd6e9;border-radius:14px;background:#fff9ff;color:#815477;padding:7px 9px;font:600 12px Fredoka,system-ui,sans-serif;cursor:pointer}
#weatherAtmosphere{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:background 1.2s,opacity 1.2s}
#weatherAtmosphere.rain{opacity:1;background:repeating-linear-gradient(110deg,transparent 0 47px,#b8d9ff0e 49px 51px,transparent 53px 105px);animation:weatherDrift .65s linear infinite}
#weatherAtmosphere.snow{opacity:.65;background-image:radial-gradient(circle,#fff 1.8px,transparent 2.7px),radial-gradient(circle,#fff 1.2px,transparent 2px);background-size:95px 100px,145px 130px;animation:snowDrift 8s linear infinite}
#weatherAtmosphere.wind{opacity:.14;background:radial-gradient(ellipse at 70% 20%,#e6f9ff,transparent 65%);animation:windBreath 5s ease-in-out infinite alternate}
#weatherAtmosphere.cloud{opacity:.35;background:linear-gradient(115deg,#b8c2d344,transparent 65%)}
#weatherAtmosphere.sun{opacity:.35;background:radial-gradient(ellipse at 25% 18%,#fff2a455,transparent 50%)}
#weatherAtmosphere.night{filter:brightness(.65)}
@keyframes windBreath{to{opacity:.28;transform:translateX(12px)}}@keyframes weatherDrift{to{background-position:0 160px}}@keyframes snowDrift{to{background-position:30px 140px,-20px 180px}}
@media(max-width:680px){#weatherControls{top:102px;right:8px;padding:6px;gap:4px}#weatherControls select{max-width:140px;font-size:11px}#mute{top:55px}}
#wardrobePanel{position:fixed;z-index:36;right:16px;top:165px;max-width:260px;background:#fffaf8f5;border:3px solid #ffd0df;border-radius:22px;padding:14px;box-shadow:0 12px 35px #64436555;color:#67415e;display:none;text-align:center}#wardrobePanel h3{margin:0 0 5px;font-size:21px}#wardrobePanel p{margin:0 0 10px;font-size:12px;color:#a86e9a}#wardrobePanel .colors{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#wardrobePanel .colors button{background:#fff;border:2px solid #f6dce9;border-radius:13px;padding:7px 3px;color:#704b6c;font:600 14px 'ZCOOL KuaiLe',sans-serif;cursor:pointer}#wardrobePanel .colors small{display:block;font:11px system-ui,sans-serif;color:#ae7d9c}#wardrobeClose{margin-top:10px;border:0;border-radius:12px;padding:6px 18px;background:#ffd5e5;color:#79465d;cursor:pointer}@media(max-width:680px){#wardrobePanel{top:155px;right:8px;max-width:220px}}
</style>
</head>
<body>
<div id="chip" class="f">🏆 Bethany · HSK 1 模拟考试 第一名</div>
<button id="mute" class="f">🎵 音乐 开 <small>yīn yuè kāi</small></button>
<div id="hint" class="f">方向键/WASD 或 ▲▼◀▶ 走路 · 上下左右拖动转视角</div>
<div id="pop"><b></b><u></u><span></span></div><div id="phoneBubble"><span></span><small></small></div>
<div id="dp"><i></i><button data-d="up">▲</button><i></i><button data-d="left">◀</button><i></i><button data-d="right">▶</button><i></i><button data-d="down">▼</button><i></i></div>
<div id="bar">
 <button data-a="smile">😊 笑一笑<small>xiào yi xiào</small></button><button data-a="walk">👣 走两步<small>zǒu liǎng bù</small></button><button data-a="chair">🪑 坐椅子<small>zuò yǐ zi</small></button>
 <button data-a="phone">📱 打电话<small>dǎ diàn huà</small></button><button data-a="type">⌨️ 打电脑<small>dǎ diàn nǎo</small></button><button data-a="pet">💗 摸宠物<small>mō chǒng wù</small></button><button data-a="bed">🛏️ 坐床上<small>zuò chuáng shàng</small></button><button data-a="sleep">😴 睡觉<small>shuì jiào</small></button><button data-a="sofa">🛋️ 坐沙发<small>zuò shā fā</small></button><button data-a="cheer">🎉 庆祝<small>qìng zhù</small></button>
</div>
<div id="weatherControls" aria-label="天气与昼夜设置">
 <label>🌦️ 天气 <small>tiān qì</small><select id="weatherChoice"><option value="random">🎲 随机 · suí jī</option><option value="sun">☀️ 晴天 · qíng tiān</option><option value="cloud">☁️ 多云 · duō yún</option><option value="rain">🌧️ 下雨 · xià yǔ</option><option value="snow">❄️ 下雪 · xià xuě</option><option value="wind">🍃 刮风 · guā fēng</option></select></label>
 <label>🕰️ 时间 <small>shí jiān</small><select id="dayChoice"><option value="auto">🔄 自动 · zì dòng</option><option value="day">🌞 白天 · bái tiān</option><option value="sunset">🌇 傍晚 · bàng wǎn</option><option value="night">🌙 晚上 · wǎn shang</option></select></label>
 </div><div id="weatherAtmosphere" aria-hidden="true"></div>
<div id="wardrobePanel"><h3>👗 换衣服</h3><p>huàn yī fu · 选择颜色 xuǎn zé yán sè</p><div class="colors" id="wardrobeColors"></div><button id="wardrobeClose">完成 · wán chéng</button></div><div id="splash"><div><h1>Bethany 的小房间</h1><p>HSK 1 模拟考试 · 第一名！</p></div><button id="go">进入 Enter</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setClearColor(0xFFF1DC);document.body.prepend(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.5,100);
const roomAmbient=new THREE.HemisphereLight(0xffffff,0xFFE2C4,.82);sc.add(roomAmbient);
const sun=new THREE.DirectionalLight(0xffffff,.5);sun.position.set(9,15,11);sc.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:45});sun.shadow.radius=6;sun.shadow.bias=-.0006;
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
const G=(p,x=0,y=0,z=0)=>{const g=new THREE.Group();g.position.set(x,y,z);(p||sc).add(g);return g};
const add=(p,geo,mat,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m};
const RB=(w,h,d,r=.08)=>{const s=new THREE.Shape(),a=w/2-r,b=h/2-r;s.moveTo(-a,-b);s.lineTo(a,-b);s.lineTo(a,b);s.lineTo(-a,b);s.closePath();const dd=Math.max(d-2*r,.001),g=new THREE.ExtrudeGeometry(s,{depth:dd,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:1});g.translate(0,0,-dd/2);return g};
const SP=r=>new THREE.SphereGeometry(r,24,16),CY=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,24);
const BM=c=>new THREE.MeshBasicMaterial({color:c});
const tag=(g,zh,py,en)=>{g.userData={zh,py,en};return g};
const cvs=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t};
const F='"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
const wood=M(0xE9B97E),white=M(0xffffff),dk=M(0x3a2a35),fw=M(0xFFFFFF),pink=M(0xFF9DB8),gold=M(0xFFD23F,{roughness:.4});

/* ---- room: corner diorama 13 x 13 ---- */
const fl=add(sc,RB(13,.5,13,.2),M(0xFFE3B8),0,-.25,0);fl.userData.floor=true;
add(sc,RB(13,6.4,.5,.18),M(0xFFE9EE),0,3.2,-6.25).userData.block=true;
add(sc,RB(.5,6.4,13,.18),M(0xFFEFD2),-6.25,3.2,0).userData.block=true;
add(sc,RB(13,.35,.2,.06),white,0,.2,-5.9);add(sc,RB(.2,.35,13,.06),white,-5.9,.2,0);
const rug=tag(G(sc,1.9,0,1.2),'地毯','dìtǎn','rug');add(rug,RB(6.2,.08,4.6,.04),M(0xFFA23C),0,.04,0);add(rug,RB(5.4,.1,3.8,.04),M(0xFFCF4D),0,.05,0);add(rug,RB(4.6,.12,3,.04),M(0xFFEB9A),0,.06,0);

/* banner + bunting (back wall) */
const drawB=x=>{x.fillStyle='#FFF8DA';x.beginPath();x.roundRect?x.roundRect(8,8,1008,384,60):x.rect(8,8,1008,384);x.fill();x.lineWidth=12;x.strokeStyle='#FF9A3C';x.stroke();x.textAlign='center';x.fillStyle='#5A3A5E';x.font='78px '+F;x.fillText('恭喜 Bethany！',512,112);x.fillStyle='#9A6A8E';x.font='36px sans-serif';x.fillText('gōng xǐ Bethany',512,155);x.fillStyle='#FF6F9C';x.font='58px '+F;x.fillText('HSK 1 模拟考试 第一名 🥇',512,228);x.fillStyle='#9A6A8E';x.font='31px sans-serif';x.fillText('mó nǐ kǎo shì · dì yī míng',512,271);x.font='700 35px Fredoka,sans-serif';x.fillText('HSK 1 Mock Test · 1st Place',512,334)};
const bt=cvs(1024,400,drawB);document.fonts.load('60px "ZCOOL KuaiLe"').then(()=>{drawB(bt.image.getContext('2d'));bt.needsUpdate=true});
const ban=tag(G(sc,-1,4.5,-5.9),'第一名！','dì-yī míng','First place! 太棒了 tài bàng le');
add(ban,new THREE.PlaneGeometry(5.2,2.05),new THREE.MeshBasicMaterial({map:bt}),0,0,.14);add(ban,RB(5.35,2.2,.12,.05),M(0xFFC76B),0,0,.04);
for(let i=0;i<14;i++){const u=i/13,s=new THREE.Shape();s.moveTo(-.2,0);s.lineTo(.2,0);s.lineTo(0,-.4);add(sc,new THREE.ShapeGeometry(s),M([0xFF8FB0,0xFFD34D,0x7FE0C0,0x8EC5F2][i%4],{side:THREE.DoubleSide}),-3.6+u*5.2,6.15-.45*(1-(u*2-1)**2),-5.95)}

/* sofa */
const sofa=tag(G(sc,-.5,0,-5.1),'沙发','shāfā','sofa');
add(sofa,RB(3.6,.85,1.5,.2),M(0xFF9DB8),0,.45,0);add(sofa,RB(3.6,1.3,.55,.22),M(0xFF8BAA),0,1.1,-.5);
[-1,1].forEach(s=>add(sofa,RB(.55,1.1,1.5,.2),M(0xFF7FA3),s*1.55,.6,0));add(sofa,RB(2.4,.3,1.05,.12),M(0xFFC2D2),0,.92,.1);add(sofa,RB(.7,.7,.25,.1),M(0xFFE070),-.9,1.25,-.1);

/* Taffie (cute) */
const tc=G(sc,.4,.1,.5);tc.rotation.y=.75;
add(tc,RB(1.3,.16,1.2,.06),wood,0,.8,0);add(tc,RB(1.3,1.1,.12,.05),wood,0,1.4,-.55);
[[-.55,-.5],[.55,-.5],[-.55,.5],[.55,.5]].forEach(p=>add(tc,CY(.07,.07,.8),wood,p[0],.4,p[1]));
add(tc,RB(1.1,.12,1,.05),M(0x8EC5F2),0,.93,0);
const taffie=tag(G(tc,0,1.0,0),'小狗 Taffie','xiǎogǒu','puppy · 汪汪 wāngwāng!');
// Fluffy white puppy inspired by the supplied reference: round face, floppy ears, curled tail.
const fur=M(0xFFFDF6),furShade=M(0xF0EAE1),noseMat=M(0x34252A);
const tb=add(taffie,SP(.43),fur,0,.40,-.07);tb.scale.set(1.12,.88,1.18);
const th=G(taffie,0,.98,.18);add(th,SP(.48),fur,0,0,0).scale.set(1.12,1.02,.92);
// Rounded tufts along the crown and cheeks.
for(let i=0;i<9;i++){const a=i*Math.PI*2/9;add(th,SP(.16),i%3?fur:furShade,Math.cos(a)*.35,Math.sin(a)*.32+.08,.06)}
[-1,1].forEach(side=>{const ear=G(th,side*.43,.13,-.06);add(ear,SP(.22),furShade,side*.06,-.17,0).scale.set(.8,1.35,.65);add(th,SP(.18),fur,side*.32,-.22,.22);add(th,SP(.068),noseMat,side*.19,.035,.43);add(th,SP(.024),white,side*.17,.065,.49)});
add(th,SP(.105),fur,0,-.15,.40).scale.set(1.45,.8,.7);
add(th,SP(.072),noseMat,0,-.13,.51);add(th,SP(.027),noseMat,0,-.25,.48);
const ears=[-1,1].map(side=>{const e=G(th,side*.43,.13,-.06);return e});
const tail=G(taffie,-.28,.65,-.43);add(tail,new THREE.TorusGeometry(.19,.11,10,20,Math.PI*1.65),fur,.04,.07,-.05).rotation.y=Math.PI/2;
[-1,1].forEach(side=>{add(taffie,SP(.17),fur,side*.25,.15,.29);add(taffie,SP(.16),fur,side*.26,.14,-.34)});
// Taffie alternates between the chair seat and the floor in front of it.
const dogHop={period:7.2,clock:0};
let dogFollowingChair=false,chairBeingDragged=false;
let heldPet=null;
const bowl=tag(G(sc,2.1,.1,1),'水碗','shuǐwǎn','water bowl');add(bowl,CY(.4,.3,.22),M(0x8EC5F2),0,.11,0);add(bowl,CY(.32,.32,.02),M(0xDDF1FF),0,.21,0);

/* Miso */
const miso=tag(G(sc,3.1,.1,1.9),'兔子 Miso','tùzi','rabbit · 蹦蹦跳跳 bèngbèng tiàotiào');miso.rotation.y=.8;
const or=M(0xFFA94A),cr=M(0xFFEDD0);
add(miso,SP(.55),or,0,.5,0).scale.set(1,.9,1.1);add(miso,SP(.35),cr,0,.4,.3);add(miso,SP(.17),fw,0,.5,-.6);
const mh=G(miso,0,1.1,.25);add(mh,SP(.44),or);
const mears=[-1,1].map(s=>{const e=G(mh,s*.17,.38,0);add(e,SP(.14),or,0,.35,0).scale.set(.8,3,.6);add(e,SP(.08),M(0xFFC2CC),0,.35,.06).scale.set(.8,3,.4);return e});
[-1,1].forEach(s=>{add(mh,SP(.08),M(0x20161c,{roughness:.2}),s*.17,0,.4);add(mh,SP(.027),white,s*.14,.04,.46);add(mh,SP(.1),M(0xFF9AA8),s*.3,-.1,.32).scale.set(1,.6,.4);add(miso,SP(.12),or,s*.17,.1,.5)});
const mn=add(mh,SP(.06),M(0xFF7A90),0,-.06,.44);
const lt=tag(G(sc,4.3,.1,1.4),'生菜','shēngcài','lettuce, Miso\'s snack');add(lt,CY(.4,.3,.25),M(0xE39A5B),0,.12,0);[0,1,2,3].forEach(i=>add(lt,SP(.22),M([0x7FD94F,0xA6E86F][i%2]),Math.cos(i*1.6)*.15,.35,Math.sin(i*1.6)*.15).scale.y=.7);

/* window (left wall) */
const win=tag(G(sc,-5.95,3.7,1.5),'窗户','chuānghu','window');win.rotation.y=Math.PI/2;
add(win,RB(2.9,2.9,.2,.1),M(0x8EC5F2),0,0,0);add(win,new THREE.PlaneGeometry(2.4,2.4),BM(0xC4E8FF),0,0,.14);
add(win,RB(.1,2.4,.1,.04),white,0,0,.18);add(win,RB(2.4,.1,.1,.04),white,0,0,.18);
add(win,SP(.3),BM(0xffffff),-.55,.55,.16).scale.set(1.5,.6,.2);add(win,SP(.25),BM(0xFFE066),.6,.7,.16).scale.z=.2;add(win,SP(.2),BM(0xffffff),.2,-.55,.16).scale.set(1.6,.6,.2);

/* Animated weather visible through the glass, and an interactive wall calendar. */
const skyCanvas=document.createElement('canvas');skyCanvas.width=512;skyCanvas.height=512;
const skyTexture=new THREE.CanvasTexture(skyCanvas);skyTexture.encoding=THREE.sRGBEncoding;
const skyPanel=add(win,new THREE.PlaneGeometry(2.36,2.36),new THREE.MeshBasicMaterial({map:skyTexture,depthWrite:false}),0,0,.151);
skyPanel.raycast=()=>{};
// Window bars must be in front of the animated weather image.
add(win,RB(.085,2.4,.07,.02),white,0,0,.23);add(win,RB(2.4,.085,.07,.02),white,0,0,.23);
const weatherKinds=['sun','cloud','rain','snow','wind'];

  const voice=femV();if(voice)u.voice=voice;try{speechSynthesis.resume()}catch(e){};

 }catch(e){done()}
})}

// Shuffle-bag: every phrase in a category is heard before any repeat.
const actionTalkBags={},lastActionLine={};
function sayActionLine(kind){
 const lines=actionTalk[kind];if(!lines||!lines.length)return;
 if(!actionTalkBags[kind]||!actionTalkBags[kind].length){
  const bag=lines.map((_,i)=>i);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  if(bag.length>1&&bag[bag.length-1]===lastActionLine[kind]){
   const j=bag.findIndex(i=>i!==lastActionLine[kind]);[bag[j],bag[bag.length-1]]=[bag[bag.length-1],bag[j]];
  }
  actionTalkBags[kind]=bag;
 }
 const idx=actionTalkBags[kind].pop();lastActionLine[kind]=idx;say(B,...lines[idx]);
}

function animalCall(kind){try{
 const C=window.AudioContext||window.webkitAudioContext,ctx=animalCall.ctx||(animalCall.ctx=new C());ctx.resume();
 const sr=ctx.sampleRate;
 // Layered animal-like sound effects: dog barks have noisy attacks and a rough voiced tail;
 // cat meows bend in pitch; rabbit uses a quiet high-pitched squeak (rabbits are usually quiet).
 const noise=ctx.createBuffer(1,Math.ceil(sr*.55),sr),nd=noise.getChannelData(0);
 for(let j=0;j<nd.length;j++)nd[j]=Math.random()*2-1;
 const play=(when,dur,lo,hi,volume,noisiness)=>{
   const env=ctx.createGain();env.gain.setValueAtTime(.0001,when);env.gain.exponentialRampToValueAtTime(volume,when+.025);env.gain.exponentialRampToValueAtTime(.0001,when+dur);env.connect(ctx.destination);
   const osc=ctx.createOscillator();osc.type=kind==='dog'?'sawtooth':'triangle';
   osc.frequency.setValueAtTime(lo,when);osc.frequency.exponentialRampToValueAtTime(hi,when+dur*.7);osc.frequency.exponentialRampToValueAtTime(Math.max(90,hi*.8),when+dur);
   const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=kind==='dog'?950:kind==='cat'?2400:3200;osc.connect(lp);lp.connect(env);osc.start(when);osc.stop(when+dur+.01);
   if(noisiness){const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=noise;f.type='bandpass';f.frequency.value=kind==='dog'?650:1400;f.Q.value=.75;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(noisiness,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+Math.min(dur,.15));src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(when);src.stop(when+Math.min(dur,.18))}
 };
 const t=ctx.currentTime+.08;
 for(let i=0;i<2;i++){const at=t+i*(kind==='dog'?.43:kind==='cat'?.8:.48);
  if(kind==='dog')play(at,.26,290,125,.13,.12);
  else if(kind==='cat')play(at,.63,470,750,.095,.018);
  else play(at,.22,1150,1650,.045,.008);
 }

/* ---- music: bouncy 8-bit loop (WebAudio) ---- */
let ac,bus,nb,on=false,ms=0,nT=0,mT;
const ROOT=[48,45,53,55,48,52,53,55];
const MEL=[[76,0,79,0,84,0,79,0],[81,0,79,0,76,0,72,0],[77,0,81,0,84,0,81,0],[79,0,83,0,86,0,83,79],[84,0,79,0,76,79,84,0],[83,0,79,0,76,0,79,83],[81,0,77,0,81,84,81,0],[79,0,83,79,77,0,72,0]];
function nt(m,t,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setValueAtTime(v,t+d*.5);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.02)}
function hat(t){const b=ac.createBufferSource(),g=ac.createGain();b.buffer=nb;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);b.connect(g);g.connect(bus);b.start(t);b.stop(t+.06)}
function msched(){while(nT<ac.currentTime+.5){const s=ms%64,b=s>>3,i=s&7,r=ROOT[b];if(MEL[b][i])nt(MEL[b][i],nT,.34,.06,'square');if(i===0)nt(r-12,nT,.45,.2,'triangle');if(i===4)nt(r-5,nT,.4,.17,'triangle');if(i&1)nt(r+[0,4,7,12][i>>1&3],nT,.12,.022,'square');if(i===2||i===6)hat(nT);nT+=.24;ms++}}
function startMusic(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const m=ac.createGain();m.gain.value=.5;m.connect(ac.destination);bus=ac.createGain();bus.connect(m);nb=ac.createBuffer(1,2400,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}ac.resume();nT=ac.currentTime+.1;clearInterval(mT);mT=setInterval(msched,120);on=true;$('#mute').textContent='🎵 音乐 开 · yīn yuè kāi'}catch(e){}}
$('#mute').onclick=()=>{if(!ac){startMusic();return}if(on){clearInterval(mT);ac.suspend();on=false;$('#mute').textContent='🔇 音乐 关 · yīn yuè guān'}else startMusic()};
